name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build, Test, Push Staging Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run verification suite
        run: ./gradlew --no-daemon clean qualityGate :app-bootstrap:bootJar

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$DOCKERHUB_REPOSITORY"

      - name: Validate Coolify configuration
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_TOKEN"
          case "$COOLIFY_DEPLOY_WEBHOOK" in
            http://*|https://*) ;;
            *)
              echo "COOLIFY_DEPLOY_WEBHOOK must be the full Coolify Deploy Webhook URL."
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}:staging

      - name: Trigger Coolify deploy (staging)
        id: coolify-deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_DEPLOY_WEBHOOK")
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "$response")
          test -n "$deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Coolify deployment queued: $deployment_uuid"

      - name: Wait for staging readiness
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.coolify-deploy.outputs.deployment_uuid }}
          STAGING_READINESS_URL: http://r5fyz2laprvyctuy8ppjfdvg.4.190.168.109.sslip.io/actuator/health/readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            status=$(curl -sS -o /tmp/staging-readiness.json -w '%{http_code}' \
              --max-time 10 "$STAGING_READINESS_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Staging readiness passed on attempt $attempt."
              cat /tmp/staging-readiness.json
              exit 0
            fi
            echo "Staging readiness attempt $attempt/40 returned HTTP ${status:-000}."
            sleep 15
          done

          coolify_base=${COOLIFY_DEPLOY_WEBHOOK%%/api/v1/*}
          echo "Staging did not become ready. Coolify deployment summary:"
          curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$coolify_base/api/v1/deployments/$DEPLOYMENT_UUID" \
            | jq '{deployment_uuid, status, created_at, updated_at, finished_at}' || true
          exit 1

      - name: Explain Coolify staging deploy
        run: |
          echo "Staging image pushed to Docker Hub."
          echo "Coolify deployment completed and staging readiness passed."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-image-publish-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
