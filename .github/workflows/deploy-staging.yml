name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build, Test, Push Staging Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run verification suite
        run: ./gradlew --no-daemon clean qualityGate :app-bootstrap:bootJar

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$DOCKERHUB_REPOSITORY"

      - name: Validate Coolify configuration
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_TOKEN"
          test -n "$GEMINI_KEY"
          case "$COOLIFY_DEPLOY_WEBHOOK" in
            http://*|https://*) ;;
            *)
              echo "COOLIFY_DEPLOY_WEBHOOK must be the full Coolify Deploy Webhook URL."
              exit 1
              ;;
          esac

      - name: Sync staging AI runtime secret
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -euo pipefail
          coolify_base=${COOLIFY_DEPLOY_WEBHOOK%%/api/v1/*}
          resource_uuid=$(sed -nE 's/.*[?&]uuid=([^&]+).*/\1/p' <<< "$COOLIFY_DEPLOY_WEBHOOK")
          test -n "$resource_uuid"

          envs=$(curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$coolify_base/api/v1/applications/$resource_uuid/envs")
          payload=$(jq -cn --arg key "GEMINI_KEY" --arg value "$GEMINI_KEY" \
            '{key: $key, value: $value, is_preview: false, is_literal: true}')

          if jq -e '.[] | select(.key == "GEMINI_KEY")' <<< "$envs" > /dev/null; then
            curl -fsS -X PATCH \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$coolify_base/api/v1/applications/$resource_uuid/envs" > /dev/null
            echo "Updated GEMINI_KEY in Coolify staging runtime."
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$coolify_base/api/v1/applications/$resource_uuid/envs" > /dev/null
            echo "Created GEMINI_KEY in Coolify staging runtime."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}:staging

      - name: Trigger Coolify deploy (staging)
        id: coolify-deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_DEPLOY_WEBHOOK")
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid // empty' <<< "$response")
          resource_uuid=$(jq -r '.deployments[0].resource_uuid // empty' <<< "$response")
          test -n "$deployment_uuid"
          test -n "$resource_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "resource_uuid=$resource_uuid" >> "$GITHUB_OUTPUT"
          echo "Coolify deployment queued: $deployment_uuid"

      - name: Wait for staging readiness
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.coolify-deploy.outputs.deployment_uuid }}
          RESOURCE_UUID: ${{ steps.coolify-deploy.outputs.resource_uuid }}
          STAGING_READINESS_URL: http://20.196.153.39:8080/actuator/health/readiness
        run: |
          set -euo pipefail
          coolify_base=${COOLIFY_DEPLOY_WEBHOOK%%/api/v1/*}
          finished_attempts=0
          for attempt in $(seq 1 40); do
            deployment=$(curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$coolify_base/api/v1/deployments/$DEPLOYMENT_UUID")
            deployment_status=$(jq -r '.status // "unknown"' <<< "$deployment")
            status=$(curl -sS -o /tmp/staging-readiness.json -w '%{http_code}' \
              --max-time 10 "$STAGING_READINESS_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Staging readiness passed on attempt $attempt."
              cat /tmp/staging-readiness.json
              exit 0
            fi
            echo "Attempt $attempt/40: deployment=$deployment_status readiness=${status:-000}."
            case "$deployment_status" in
              failed|cancelled*) break ;;
              finished)
                finished_attempts=$((finished_attempts + 1))
                if [ "$finished_attempts" -ge 8 ]; then
                  break
                fi
                ;;
              *) finished_attempts=0 ;;
            esac
            sleep 15
          done

          echo "Staging did not become ready. Coolify deployment logs:"
          jq -r '.logs // "No deployment logs returned."' <<< "$deployment" | tail -n 200
          echo "Coolify application logs:"
          curl -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$coolify_base/api/v1/applications/$RESOURCE_UUID/logs?lines=200" \
            | jq -r '.logs // "No application logs returned."' || true
          exit 1

      - name: Explain Coolify staging deploy
        run: |
          echo "Staging image pushed to Docker Hub."
          echo "Coolify deployment completed and staging readiness passed."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-image-publish-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
