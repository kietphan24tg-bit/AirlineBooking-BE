name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build, Test, Push Staging Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run verification suite
        run: ./gradlew --no-daemon clean qualityGate :app-bootstrap:bootJar

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$DOCKERHUB_REPOSITORY"

      - name: Validate Coolify configuration
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          case "$COOLIFY_DEPLOY_WEBHOOK" in
            http://*|https://*) ;;
            *)
              echo "COOLIFY_DEPLOY_WEBHOOK must be the full Coolify Deploy Webhook URL."
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}:staging

      - name: Trigger Coolify deploy (staging)
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          set -e
          curl -fsS "$COOLIFY_DEPLOY_WEBHOOK"

      - name: Explain Coolify staging deploy
        run: |
          echo "Staging image pushed to Docker Hub."
          echo "Deploy was triggered via the Coolify Deploy Webhook for staging."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-image-publish-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
