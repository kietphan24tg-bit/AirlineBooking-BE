name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Build, Test, Push Staging Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run verification suite
        run: ./gradlew --no-daemon clean qualityGate :app-bootstrap:bootJar

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test -n "$DOCKERHUB_REPOSITORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_REPOSITORY }}:staging

      - name: Trigger Railway redeploy (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e
          test -n "$RAILWAY_TOKEN"
          test -n "${{ secrets.RAILWAY_SERVICE_ID }}"
          npm i -g @railway/cli
          railway redeploy --service "${{ secrets.RAILWAY_SERVICE_ID }}" --yes

      - name: Explain Railway staging behavior
        run: |
          echo "Staging image pushed to Docker Hub."
          echo "Redeploy was triggered via Railway CLI (recommended)."
          echo "Optional: also enable image auto-updates on the Railway service if you want a fallback."

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-image-publish-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
