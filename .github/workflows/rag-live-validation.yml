name: RAG Live Validation

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of executions per question
        required: true
        default: '1'
      variants:
        description: Include no-accent variants
        required: true
        type: boolean
        default: false
      ingest:
        description: Refresh production policy vectors before validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve staging datasource from Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_DEPLOY_WEBHOOK"
          test -n "$COOLIFY_API_TOKEN"

          coolify_base=${COOLIFY_DEPLOY_WEBHOOK%%/api/v1/*}
          resource_uuid=$(sed -nE 's/.*[?&]uuid=([^&]+).*/\1/p' <<< "$COOLIFY_DEPLOY_WEBHOOK")
          test -n "$resource_uuid"

          envs=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$coolify_base/api/v1/applications/$resource_uuid/envs")
          staging_db_url=$(jq -r '.[] | select(.key == "SPRING_DATASOURCE_URL" and .is_preview == false) | .value' <<< "$envs" | tail -n 1)
          staging_db_user=$(jq -r '.[] | select(.key == "SPRING_DATASOURCE_USERNAME" and .is_preview == false) | .value' <<< "$envs" | tail -n 1)
          staging_db_password=$(jq -r '.[] | select(.key == "SPRING_DATASOURCE_PASSWORD" and .is_preview == false) | .value' <<< "$envs" | tail -n 1)

          test -n "$staging_db_url"
          test -n "$staging_db_user"
          test -n "$staging_db_password"
          echo "::add-mask::$staging_db_url"
          echo "::add-mask::$staging_db_user"
          echo "::add-mask::$staging_db_password"
          {
            echo "SPRING_DATASOURCE_URL=$staging_db_url"
            echo "SPRING_DATASOURCE_USERNAME=$staging_db_user"
            echo "SPRING_DATASOURCE_PASSWORD=$staging_db_password"
          } >> "$GITHUB_ENV"

      - name: Run live RAG quality gate
        run: >-
          ./gradlew --no-daemon :module-ai:ragLiveValidation
          -PragValidationRunId=gha-${{ github.run_id }}-${{ github.run_attempt }}
          -PragValidationCommit=${{ github.sha }}
          -PragValidationRepeats=${{ inputs.repeats }}
          -PragValidationVariants=${{ inputs.variants }}
          -PragValidationIngest=${{ inputs.ingest }}
          --console=plain

      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: module-ai/build/reports/rag-validation/**
          if-no-files-found: warn
