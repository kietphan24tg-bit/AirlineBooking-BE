name: RAG Live Validation

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Number of executions per question
        required: true
        default: '1'
      variants:
        description: Include no-accent variants
        required: true
        type: boolean
        default: false
      ingest:
        description: Refresh production policy vectors before validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      SPRING_DATASOURCE_URL: ${{ secrets.RAG_STAGING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.RAG_STAGING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.RAG_STAGING_DATASOURCE_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run live RAG quality gate
        run: >-
          ./gradlew --no-daemon :module-ai:ragLiveValidation
          -PragValidationRunId=gha-${{ github.run_id }}-${{ github.run_attempt }}
          -PragValidationCommit=${{ github.sha }}
          -PragValidationRepeats=${{ inputs.repeats }}
          -PragValidationVariants=${{ inputs.variants }}
          -PragValidationIngest=${{ inputs.ingest }}
          --console=plain

      - name: Upload immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: module-ai/build/reports/rag-validation/**
          if-no-files-found: warn
