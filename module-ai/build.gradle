plugins {
    id 'java-library'
}

dependencies {
    implementation project(':common')
    implementation project(':module-booking')
    implementation project(':module-payment')
    implementation project(':module-flight')
    implementation project(':module-checkin')
    implementation project(':module-identity')

    implementation 'org.springframework:spring-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-timelimiter:2.4.0'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.40'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.7'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rag-live'
        excludeTags 'agent-live'
        excludeTags 'postgres-integration'
    }
}

tasks.register('ragResilienceGate', Test) {
    group = 'verification'
    description = 'Runs deterministic AI provider fault, capacity, metrics, and fallback tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rag-resilience'
    }
}

tasks.register('ragLiveValidation', Test) {
    group = 'verification'
    description = 'Runs the live PGVector + Gemini RAG validation checklist.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rag-live'
    }

    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine('UTF-8') { rawLine ->
            def line = rawLine?.trim()
            if (!line || line.startsWith('#')) {
                return
            }
            def separatorIndex = line.indexOf('=')
            if (separatorIndex <= 0) {
                return
            }
            def key = line.substring(0, separatorIndex).trim()
            def value = line.substring(separatorIndex + 1).trim()
            if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length() - 1)
            }
            environment key, value
        }
    }

    if ((findProperty('ragValidationUseLocalDatabase') ?: 'false').toBoolean()) {
        def localPort = findProperty('ragValidationDatabasePort') ?: '5432'
        def localPassword = findProperty('ragValidationDatabasePassword') ?: 'postgres'
        environment 'SPRING_DATASOURCE_URL', "jdbc:postgresql://127.0.0.1:${localPort}/airline_booking"
        environment 'SPRING_DATASOURCE_USERNAME', 'postgres'
        environment 'SPRING_DATASOURCE_PASSWORD', localPassword
    }

    systemProperty 'rag.validation.top-k', findProperty('ragValidationTopK') ?: '5'
    systemProperty 'rag.validation.repeats', findProperty('ragValidationRepeats') ?: '1'
    systemProperty 'rag.validation.variants', findProperty('ragValidationVariants') ?: 'false'
    systemProperty 'rag.validation.delay-millis', findProperty('ragValidationDelayMillis') ?: '5000'
    systemProperty 'rag.validation.max-cases', findProperty('ragValidationMaxCases') ?: Integer.MAX_VALUE.toString()
    systemProperty 'rag.validation.case-ids', findProperty('ragValidationCaseIds') ?: ''
    systemProperty 'rag.validation.ingest', findProperty('ragValidationIngest') ?: 'true'
    systemProperty 'rag.validation.generation-only', findProperty('ragValidationGenerationOnly') ?: 'false'
    systemProperty 'rag.validation.judge-only', findProperty('ragValidationJudgeOnly') ?: 'false'
    systemProperty 'rag.validation.resume-from', findProperty('ragValidationResumeFrom') ?: ''
    systemProperty 'rag.validation.report-dir', findProperty('ragValidationReportDir') ?: 'build/reports/rag-validation'
    systemProperty 'rag.validation.commit', findProperty('ragValidationCommit') ?: (System.getenv('GITHUB_SHA') ?: 'unknown')
    systemProperty 'rag.validation.chat-provider', findProperty('ragValidationChatProvider') ?: 'google-genai'
    systemProperty 'rag.validation.chat-model', findProperty('ragValidationChatModel') ?: 'gemini-3.5-flash'
    systemProperty 'rag.validation.embedding-model', findProperty('ragValidationEmbeddingModel') ?: 'gemini-embedding-001'
    if (findProperty('ragValidationRunId')) {
        systemProperty 'rag.validation.run-id', findProperty('ragValidationRunId')
    }
}

