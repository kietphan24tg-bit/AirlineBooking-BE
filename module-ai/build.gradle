tasks.register('postgresIntegrationTest', Test) {
    group = 'verification'
    description = 'Runs PostgreSQL integration tests against the configured external datasource.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'postgres-integration'
    }
    filter {
        includeTestsMatching 'com.example.moduleai.confirmation.ToolConfirmationServicePostgresIntegrationTest'
    }

    def envFile = rootProject.file('.env')
