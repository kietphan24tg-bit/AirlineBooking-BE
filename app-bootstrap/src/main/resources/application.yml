spring:
    application:
        name: airline-booking
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_DATA_REDIS_PASSWORD:}
            timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
    port: ${SERVER_PORT:8080}
    forward-headers-strategy: framework

springdoc:
    api-docs:
        enabled: ${APP_SWAGGER_ENABLED:true}
        path: /v3/api-docs
    swagger-ui:
        enabled: ${APP_SWAGGER_ENABLED:true}
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
        display-request-duration: true
        doc-expansion: none
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

management:
    endpoints:
        web:
            exposure:
                include: health,info

app:
    cors:
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.railway.app}
    auth:
        refresh-cookie:
            name: ${APP_AUTH_REFRESH_COOKIE_NAME:refresh_token}
            path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
            domain: ${APP_AUTH_REFRESH_COOKIE_DOMAIN:}
            secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
            http-only: ${APP_AUTH_REFRESH_COOKIE_HTTP_ONLY:true}
            same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
            max-age-seconds: ${APP_AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
    jwt:
        secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLWluLWxvY2FsLWRldmVsb3BtZW50LWp3dC1zZWNyZXQta2V5LTMyLWNoYXJzLXVwZGF0ZWQ=}
        access-token-expiration-minutes: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
        refresh-token-expiration-days: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    booking:
        pnr-expiration-minutes: ${APP_BOOKING_PNR_EXPIRATION_MINUTES:15}
        checkin-open-hours: ${APP_BOOKING_CHECKIN_OPEN_HOURS:24}
        domestic-checkin-close-minutes: ${APP_BOOKING_DOMESTIC_CHECKIN_CLOSE_MINUTES:40}
        international-checkin-close-minutes: ${APP_BOOKING_INTERNATIONAL_CHECKIN_CLOSE_MINUTES:60}
    airport-import:
        enabled: ${APP_AIRPORT_IMPORT_ENABLED:false}
        base-url: ${APP_AIRPORT_IMPORT_BASE_URL:https://airportsapi.com}
        cron: ${APP_AIRPORT_IMPORT_CRON:0 0 3 * * *}
        page-size: ${APP_AIRPORT_IMPORT_PAGE_SIZE:100}
        request-timeout-seconds: ${APP_AIRPORT_IMPORT_REQUEST_TIMEOUT_SECONDS:20}
        max-retries: ${APP_AIRPORT_IMPORT_MAX_RETRIES:2}
        allowed-types: ${APP_AIRPORT_IMPORT_ALLOWED_TYPES:medium_airport,large_airport}
        require-iata: ${APP_AIRPORT_IMPORT_REQUIRE_IATA:true}
        include: ${APP_AIRPORT_IMPORT_INCLUDE:country,region}
        fallback-city: ${APP_AIRPORT_IMPORT_FALLBACK_CITY:UNKNOWN}
        fallback-country: ${APP_AIRPORT_IMPORT_FALLBACK_COUNTRY:UNKNOWN}
        fallback-time-zone: ${APP_AIRPORT_IMPORT_FALLBACK_TIME_ZONE:UTC}
    airline-import:
        enabled: ${APP_AIRLINE_IMPORT_ENABLED:false}
        base-url: ${APP_AIRLINE_IMPORT_BASE_URL:https://airlabs.co}
        api-key: ${APP_AIRLABS_API_KEY:}
        cron: ${APP_AIRLINE_IMPORT_CRON:0 30 3 * * *}
        request-timeout-seconds: ${APP_AIRLINE_IMPORT_REQUEST_TIMEOUT_SECONDS:30}
        max-retries: ${APP_AIRLINE_IMPORT_MAX_RETRIES:2}
        require-iata: ${APP_AIRLINE_IMPORT_REQUIRE_IATA:false}
        # AirLabs _fields (comma-separated); include country_code per Airlines DB docs (airlabs.co/docs/airlines).
        fields: "${APP_AIRLINE_IMPORT_FIELDS:name,iata_code,icao_code,country_code}"
        # Countries DB (airlabs.co/docs/countries) for ISO2 -> display name when airline has country_code.
        fetch-countries-enrichment: ${APP_AIRLINE_IMPORT_FETCH_COUNTRIES_ENRICHMENT:true}
        countries-fields: "${APP_AIRLINE_IMPORT_COUNTRIES_FIELDS:code,name}"
    payment:
        provider: ${APP_PAYMENT_PROVIDER:payos}
        # Unused for PayOS (webhook HMAC uses payos.checksum-key). Retained for existing env binding.
        webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:change-me}
        return-url: ${APP_PAYMENT_RETURN_URL:http://localhost:3000/payment/success}
        cancel-url: ${APP_PAYMENT_CANCEL_URL:http://localhost:3000/payment/cancel}
        payos:
            client-id: ${PAYOS_CLIENT_ID:}
            api-key: ${PAYOS_API_KEY:}
            checksum-key: ${PAYOS_CHECKSUM_KEY:}
            base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    mail:
        from: ${APP_MAIL_FROM:noreply@airline-booking.local}
    logging:
        request-id-header: ${APP_REQUEST_ID_HEADER:X-Request-Id}
        json-enabled: ${APP_LOG_JSON_ENABLED:false}
    client-ip:
        trusted-proxies: ${APP_CLIENT_IP_TRUSTED_PROXIES:127.0.0.1,::1}
    swagger:
        title: ${APP_SWAGGER_TITLE:Airline Booking API}
        description: ${APP_SWAGGER_DESCRIPTION:Modular monolith backend for airline booking, payment, notification, and check-in workflows.}
        version: ${APP_SWAGGER_VERSION:v1}
    rate-limit:
        enabled: ${APP_RATE_LIMIT_ENABLED:true}
        fail-open: ${APP_RATE_LIMIT_FAIL_OPEN:true}
        login:
            window: ${APP_RATE_LIMIT_LOGIN_WINDOW:10m}
            email-limit: ${APP_RATE_LIMIT_LOGIN_EMAIL_LIMIT:5}
            client-limit: ${APP_RATE_LIMIT_LOGIN_CLIENT_LIMIT:20}
            pair-limit: ${APP_RATE_LIMIT_LOGIN_PAIR_LIMIT:5}
        password-reset:
            window: ${APP_RATE_LIMIT_PASSWORD_RESET_WINDOW:15m}
            email-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_EMAIL_LIMIT:3}
            client-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_CLIENT_LIMIT:10}
            pair-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_PAIR_LIMIT:3}
        refresh:
            window: ${APP_RATE_LIMIT_REFRESH_WINDOW:5m}
            user-limit: ${APP_RATE_LIMIT_REFRESH_USER_LIMIT:20}
            client-limit: ${APP_RATE_LIMIT_REFRESH_CLIENT_LIMIT:60}
