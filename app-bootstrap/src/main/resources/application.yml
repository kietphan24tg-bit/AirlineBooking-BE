spring:
    application:
        name: airline-booking
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
    autoconfigure:
        exclude:
            - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
    ai:
        model:
            chat: ${APP_AI_CHAT_PROVIDER:google-genai}
            embedding: google-genai
        retry:
            # The application guard owns failure handling; avoid nested Spring AI retries.
            max-attempts: ${APP_AI_PROVIDER_SDK_MAX_ATTEMPTS:1}
        google:
            genai:
                api-key: ${GEMINI_KEY:}
                chat:
                    options:
                        model: ${APP_AI_CHAT_MODEL:gemini-3.5-flash-lite}
                        temperature: 0.2
                        max-output-tokens: 800
                embedding:
                    api-key: ${GEMINI_KEY:}
                    text:
                        model: ${APP_AI_RAG_EMBEDDING_MODEL:gemini-embedding-001}
                        task-type: RETRIEVAL_DOCUMENT
                        dimensions: ${APP_AI_RAG_EMBEDDING_DIMENSIONS:768}
                        auto-truncate: true
        openai:
            api-key: ${GROQ_API_KEY:}
            base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
            timeout: ${APP_AI_PROVIDER_TIMEOUT:45s}
            max-retries: ${APP_AI_PROVIDER_SDK_MAX_ATTEMPTS:1}
            chat:
                options:
                    model: ${GROQ_MODEL:qwen/qwen3.8-27b}
                    temperature: 0.2
                    max-tokens: 800
        vectorstore:
            pgvector:
                initialize-schema: ${APP_AI_RAG_VECTORSTORE_INITIALIZE_SCHEMA:true}
                index-type: HNSW
                distance-type: COSINE_DISTANCE
                dimensions: ${APP_AI_RAG_EMBEDDING_DIMENSIONS:768}
                max-document-batch-size: ${APP_AI_RAG_VECTORSTORE_MAX_DOCUMENT_BATCH_SIZE:1000}
    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST:localhost}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            password: ${SPRING_DATA_REDIS_PASSWORD:}
            timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}

server:
    # Render/Heroku set PORT; local tooling often uses SERVER_PORT.
    port: ${PORT:${SERVER_PORT:8080}}
    forward-headers-strategy: framework

springdoc:
    api-docs:
        enabled: ${APP_SWAGGER_ENABLED:true}
        path: /v3/api-docs
    swagger-ui:
        enabled: ${APP_SWAGGER_ENABLED:true}
        path: /swagger-ui.html
        operations-sorter: method
        tags-sorter: alpha
        display-request-duration: true
        doc-expansion: none
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

management:
    endpoint:
        health:
            probes:
                enabled: true
            group:
                readiness:
                    include: readinessState,db
                ai:
                    include: aiProvider
        metrics:
            enabled: ${MANAGEMENT_ENDPOINT_METRICS_ENABLED:true}
        prometheus:
            enabled: ${MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED:true}
    endpoints:
        web:
            exposure:
                include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}

app:
    ai:
        agent:
            actions-enabled: ${APP_AI_AGENT_ACTIONS_ENABLED:false}
        chat:
            persistence-enabled: ${APP_AI_CHAT_PERSISTENCE_ENABLED:true}
            memory-enabled: ${APP_AI_CHAT_MEMORY_ENABLED:true}
            inactivity-timeout: ${APP_AI_CHAT_INACTIVITY_TIMEOUT:24h}
            recent-turns: ${APP_AI_CHAT_RECENT_TURNS:8}
            context-budget-chars: ${APP_AI_CHAT_CONTEXT_BUDGET_CHARS:24000}
            summary-max-chars: ${APP_AI_CHAT_SUMMARY_MAX_CHARS:4000}
            user-retention: ${APP_AI_CHAT_USER_RETENTION:30d}
            guest-retention: ${APP_AI_CHAT_GUEST_RETENTION:7d}
            guest-cookie-max-age: ${APP_AI_CHAT_GUEST_COOKIE_MAX_AGE:7d}
            maintenance-delay: ${APP_AI_CHAT_MAINTENANCE_DELAY:1m}
            summary-batch-size: ${APP_AI_CHAT_SUMMARY_BATCH_SIZE:10}
            summary-claim-timeout: ${APP_AI_CHAT_SUMMARY_CLAIM_TIMEOUT:2m}
            summary-max-attempts: ${APP_AI_CHAT_SUMMARY_MAX_ATTEMPTS:3}
            guest-cookie-name: ${APP_AI_CHAT_GUEST_COOKIE_NAME:chat_guest}
            guest-cookie-path: ${APP_AI_CHAT_GUEST_COOKIE_PATH:/api/chatbot}
            guest-cookie-secure: ${APP_AI_CHAT_GUEST_COOKIE_SECURE:true}
            guest-cookie-http-only: ${APP_AI_CHAT_GUEST_COOKIE_HTTP_ONLY:true}
            guest-cookie-same-site: ${APP_AI_CHAT_GUEST_COOKIE_SAME_SITE:None}
            confirmation-hmac-secret: ${APP_AI_AGENT_CONFIRMATION_HMAC_SECRET:}
            proposal-ttl: ${APP_AI_AGENT_PROPOSAL_TTL:5m}
            executing-timeout: ${APP_AI_AGENT_EXECUTING_TIMEOUT:2m}
            query-rate-limit-window: ${APP_AI_AGENT_QUERY_RATE_LIMIT_WINDOW:1m}
            query-rate-limit-per-user: ${APP_AI_AGENT_QUERY_RATE_LIMIT_PER_USER:30}
            query-rate-limit-per-ip: ${APP_AI_AGENT_QUERY_RATE_LIMIT_PER_IP:60}
            confirmation-rate-limit-window: ${APP_AI_AGENT_CONFIRMATION_RATE_LIMIT_WINDOW:1m}
            confirmation-rate-limit-per-user: ${APP_AI_AGENT_CONFIRMATION_RATE_LIMIT_PER_USER:10}
            query-rate-limit-fail-open: ${APP_AI_AGENT_QUERY_RATE_LIMIT_FAIL_OPEN:true}
            concurrency-slot-ttl: ${APP_AI_AGENT_CONCURRENCY_SLOT_TTL:2m}
            concurrency-fail-open: ${APP_AI_AGENT_CONCURRENCY_FAIL_OPEN:false}
            rollout:
                mode: ${APP_AI_AGENT_ROLLOUT_MODE:OFF}
                enabled-tools: ${APP_AI_AGENT_ENABLED_TOOLS:}
                canary-user-ids: ${APP_AI_AGENT_CANARY_USER_IDS:}
            guardrail:
                max-message-length: ${APP_AI_AGENT_GUARDRAIL_MAX_MESSAGE_LENGTH:4000}
                max-tool-calls-per-turn: ${APP_AI_AGENT_GUARDRAIL_MAX_TOOL_CALLS_PER_TURN:1}
                max-model-rounds-per-turn: ${APP_AI_AGENT_GUARDRAIL_MAX_MODEL_ROUNDS_PER_TURN:3}
                max-structured-field-length: ${APP_AI_AGENT_GUARDRAIL_MAX_STRUCTURED_FIELD_LENGTH:256}
                max-output-string-length: ${APP_AI_AGENT_GUARDRAIL_MAX_OUTPUT_STRING_LENGTH:1024}
                max-output-collection-items: ${APP_AI_AGENT_GUARDRAIL_MAX_OUTPUT_COLLECTION_ITEMS:20}
                max-output-json-bytes: ${APP_AI_AGENT_GUARDRAIL_MAX_OUTPUT_JSON_BYTES:16384}
        provider:
            timeout: ${APP_AI_PROVIDER_TIMEOUT:25s}
            google-http-timeout-enabled: ${APP_AI_PROVIDER_GOOGLE_HTTP_TIMEOUT_ENABLED:true}
            max-concurrent-calls: ${APP_AI_PROVIDER_MAX_CONCURRENT_CALLS:4}
            queue-capacity: ${APP_AI_PROVIDER_QUEUE_CAPACITY:4}
            rate-limit-permits: ${APP_AI_PROVIDER_RATE_LIMIT_PERMITS:120}
            rate-limit-refresh-period: ${APP_AI_PROVIDER_RATE_LIMIT_REFRESH_PERIOD:1m}
            rate-limit-wait: ${APP_AI_PROVIDER_RATE_LIMIT_WAIT:100ms}
            circuit-sliding-window-size: ${APP_AI_PROVIDER_CIRCUIT_SLIDING_WINDOW_SIZE:10}
            # Evaluate after a complete 10-call sample to avoid opening on a small error cluster.
            circuit-minimum-calls: ${APP_AI_PROVIDER_CIRCUIT_MINIMUM_CALLS:10}
            circuit-failure-rate-threshold: ${APP_AI_PROVIDER_CIRCUIT_FAILURE_RATE_THRESHOLD:50}
            circuit-open-duration: ${APP_AI_PROVIDER_CIRCUIT_OPEN_DURATION:30s}
            circuit-half-open-calls: ${APP_AI_PROVIDER_CIRCUIT_HALF_OPEN_CALLS:3}
        rag:
            docs-path: ${APP_AI_RAG_DOCS_PATH:docs/specs/rag}
            top-k: ${APP_AI_RAG_TOP_K:5}
            ingest-on-startup: ${APP_AI_RAG_INGEST_ON_STARTUP:false}
            ingest-batch-size: ${APP_AI_RAG_INGEST_BATCH_SIZE:80}
            ingest-batch-delay: ${APP_AI_RAG_INGEST_BATCH_DELAY:65s}
    cors:
        allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,https://*.railway.app,https://*.vercel.app}
    auth:
        refresh-cookie:
            name: ${APP_AUTH_REFRESH_COOKIE_NAME:refresh_token}
            path: ${APP_AUTH_REFRESH_COOKIE_PATH:/api/auth}
            domain: ${APP_AUTH_REFRESH_COOKIE_DOMAIN:}
            secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:false}
            http-only: ${APP_AUTH_REFRESH_COOKIE_HTTP_ONLY:true}
            same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
            max-age-seconds: ${APP_AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
    jwt:
        secret: ${APP_JWT_SECRET:Y2hhbmdlLW1lLWluLWxvY2FsLWRldmVsb3BtZW50LWp3dC1zZWNyZXQta2V5LTMyLWNoYXJzLXVwZGF0ZWQ=}
        access-token-expiration-minutes: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
        refresh-token-expiration-days: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
    booking:
        pnr-expiration-minutes: ${APP_BOOKING_PNR_EXPIRATION_MINUTES:15}
        checkin-open-hours: ${APP_BOOKING_CHECKIN_OPEN_HOURS:24}
        domestic-checkin-close-minutes: ${APP_BOOKING_DOMESTIC_CHECKIN_CLOSE_MINUTES:40}
        international-checkin-close-minutes: ${APP_BOOKING_INTERNATIONAL_CHECKIN_CLOSE_MINUTES:60}
        flight-change-quote-expiration-minutes: ${APP_BOOKING_FLIGHT_CHANGE_QUOTE_EXPIRATION_MINUTES:15}
        flight-change-close-minutes: ${APP_BOOKING_FLIGHT_CHANGE_CLOSE_MINUTES:180}
        minimum-connection-minutes: ${APP_BOOKING_MINIMUM_CONNECTION_MINUTES:90}
    airport-import:
        enabled: ${APP_AIRPORT_IMPORT_ENABLED:false}
        run-on-startup: ${APP_AIRPORT_IMPORT_RUN_ON_STARTUP:false}
        base-url: ${APP_AIRPORT_IMPORT_BASE_URL:https://airportsapi.com}
        cron: ${APP_AIRPORT_IMPORT_CRON:0 0 3 * * *}
        page-size: ${APP_AIRPORT_IMPORT_PAGE_SIZE:100}
        request-timeout-seconds: ${APP_AIRPORT_IMPORT_REQUEST_TIMEOUT_SECONDS:20}
        max-retries: ${APP_AIRPORT_IMPORT_MAX_RETRIES:2}
        allowed-types: ${APP_AIRPORT_IMPORT_ALLOWED_TYPES:medium_airport,large_airport}
        require-iata: ${APP_AIRPORT_IMPORT_REQUIRE_IATA:true}
        include: ${APP_AIRPORT_IMPORT_INCLUDE:country,region}
        fallback-city: ${APP_AIRPORT_IMPORT_FALLBACK_CITY:UNKNOWN}
        fallback-country: ${APP_AIRPORT_IMPORT_FALLBACK_COUNTRY:UNKNOWN}
        fallback-time-zone: ${APP_AIRPORT_IMPORT_FALLBACK_TIME_ZONE:UTC}
    airport-market:
        default-market: ${APP_AIRPORT_MARKET_DEFAULT_MARKET:VN}
        proxy-country-headers: ${APP_AIRPORT_MARKET_PROXY_COUNTRY_HEADERS:CF-IPCountry,X-Vercel-IP-Country,CloudFront-Viewer-Country,X-App-Country}
        geoip-score: ${APP_AIRPORT_MARKET_GEOIP_SCORE:60}
    airline-import:
        enabled: ${APP_AIRLINE_IMPORT_ENABLED:false}
        run-on-startup: ${APP_AIRLINE_IMPORT_RUN_ON_STARTUP:false}
        base-url: ${APP_AIRLINE_IMPORT_BASE_URL:https://airlabs.co}
        api-key: ${APP_AIRLABS_API_KEY:}
        cron: ${APP_AIRLINE_IMPORT_CRON:0 30 3 * * *}
        request-timeout-seconds: ${APP_AIRLINE_IMPORT_REQUEST_TIMEOUT_SECONDS:30}
        max-retries: ${APP_AIRLINE_IMPORT_MAX_RETRIES:2}
        require-iata: ${APP_AIRLINE_IMPORT_REQUIRE_IATA:false}
        # AirLabs _fields (comma-separated); include country_code per Airlines DB docs (airlabs.co/docs/airlines).
        fields: "${APP_AIRLINE_IMPORT_FIELDS:name,iata_code,icao_code,country_code}"
        # Countries DB (airlabs.co/docs/countries) for ISO2 -> display name when airline has country_code.
        fetch-countries-enrichment: ${APP_AIRLINE_IMPORT_FETCH_COUNTRIES_ENRICHMENT:true}
        countries-fields: "${APP_AIRLINE_IMPORT_COUNTRIES_FIELDS:code,name}"
    flight-import:
        enabled: ${APP_FLIGHT_IMPORT_ENABLED:false}
        run-on-startup: ${APP_FLIGHT_IMPORT_RUN_ON_STARTUP:false}
        base-url: ${APP_FLIGHT_IMPORT_BASE_URL:https://airlabs.co}
        api-key: ${APP_AIRLABS_API_KEY:}
        cron: ${APP_FLIGHT_IMPORT_CRON:0 0 2 * * *}
        request-timeout-seconds: ${APP_FLIGHT_IMPORT_REQUEST_TIMEOUT_SECONDS:30}
        max-retries: ${APP_FLIGHT_IMPORT_MAX_RETRIES:2}
        airline-iata-codes: ${APP_FLIGHT_IMPORT_AIRLINE_IATA_CODES:VN,VJ,QH}
        days-ahead: ${APP_FLIGHT_IMPORT_DAYS_AHEAD:7}
    flight-maintenance:
        cron: ${APP_FLIGHT_MAINTENANCE_CRON:0 30 2 * * *}
        run-on-startup: ${APP_FLIGHT_MAINTENANCE_RUN_ON_STARTUP:false}
        cleanup-enabled: ${APP_FLIGHT_MAINTENANCE_CLEANUP_ENABLED:true}
    flight-coverage:
        # Scopes internally seeded flight data; scheduled maintenance no longer performs gap-fill.
        enabled: ${APP_FLIGHT_COVERAGE_ENABLED:true}
        rolling-days: ${APP_FLIGHT_COVERAGE_ROLLING_DAYS:30}
        start-date-offset-days: ${APP_FLIGHT_COVERAGE_START_DATE_OFFSET_DAYS:1}
        include-airport-country-codes: ${APP_FLIGHT_COVERAGE_INCLUDE_AIRPORT_COUNTRY_CODES:VN,TH,SG,MY,ID,PH}
        flights-per-route-per-day: ${APP_FLIGHT_COVERAGE_FLIGHTS_PER_ROUTE_PER_DAY:3}
        max-flights-per-run: ${APP_FLIGHT_COVERAGE_MAX_FLIGHTS_PER_RUN:20000}
        excluded-airline-codes: ${APP_FLIGHT_COVERAGE_EXCLUDED_AIRLINE_CODES:}
        excluded-airline-country-codes: ${APP_FLIGHT_COVERAGE_EXCLUDED_AIRLINE_COUNTRY_CODES:}
        excluded-airport-country-codes: ${APP_FLIGHT_COVERAGE_EXCLUDED_AIRPORT_COUNTRY_CODES:}
    flight-search-fallback:
        enabled: ${APP_FLIGHT_SEARCH_FALLBACK_ENABLED:true}
    flight-mock:
        # Drives the scheduled internal flight reseed batch; scope is inherited from flight-coverage.
        enabled: ${APP_FLIGHT_MOCK_ENABLED:false}
        run-on-startup: ${APP_FLIGHT_MOCK_RUN_ON_STARTUP:false}
        cron: ${APP_FLIGHT_MOCK_CRON:0 0 4 * * *}
        force-when-tickets-exist: ${APP_FLIGHT_MOCK_FORCE_WHEN_TICKETS_EXIST:false}
        target-flight-count: ${APP_FLIGHT_MOCK_TARGET_FLIGHT_COUNT:0}
        flights-per-aircraft: ${APP_FLIGHT_MOCK_FLIGHTS_PER_AIRCRAFT:3}
        days-span: ${APP_FLIGHT_MOCK_DAYS_SPAN:14}
        start-date-offset-days: ${APP_FLIGHT_MOCK_START_DATE_OFFSET_DAYS:1}
        excluded-airline-codes: ${APP_FLIGHT_MOCK_EXCLUDED_AIRLINE_CODES:VN,VJ,QH}
        excluded-airline-country-codes: ${APP_FLIGHT_MOCK_EXCLUDED_AIRLINE_COUNTRY_CODES:VN}
        excluded-airport-country-codes: ${APP_FLIGHT_MOCK_EXCLUDED_AIRPORT_COUNTRY_CODES:}
    payment:
        provider: ${APP_PAYMENT_PROVIDER:payos}
        # Unused for PayOS (webhook HMAC uses payos.checksum-key). Retained for existing env binding.
        webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:change-me}
        return-url: ${APP_PAYMENT_RETURN_URL:http://localhost:5173/payment/success}
        cancel-url: ${APP_PAYMENT_CANCEL_URL:http://localhost:5173/payment/cancel}
        # Optional public origin for payment flows. Payment method icons themselves are returned
        # as relative /assets/* paths so frontend can resolve them against its configured backend.
        icon-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
        payos:
            client-id: ${PAYOS_CLIENT_ID:}
            api-key: ${PAYOS_API_KEY:}
            checksum-key: ${PAYOS_CHECKSUM_KEY:}
            base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
        stripe:
            secret-key: ${STRIPE_SECRET_KEY:}
            webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
            api-version: ${STRIPE_API_VERSION:2026-02-25.clover}
    mail:
        from: ${APP_MAIL_FROM:noreply@airline-booking.local}
    password-reset:
        email-enabled: ${APP_PASSWORD_RESET_EMAIL_ENABLED:true}
    logging:
        request-id-header: ${APP_REQUEST_ID_HEADER:X-Request-Id}
        json-enabled: ${APP_LOG_JSON_ENABLED:false}
    client-ip:
        trusted-proxies: ${APP_CLIENT_IP_TRUSTED_PROXIES:127.0.0.1,::1}
    swagger:
        title: ${APP_SWAGGER_TITLE:Airline Booking API}
        description: ${APP_SWAGGER_DESCRIPTION:Modular monolith backend for airline booking, payment, notification, and check-in workflows.}
        version: ${APP_SWAGGER_VERSION:v1}
    rate-limit:
        enabled: ${APP_RATE_LIMIT_ENABLED:true}
        fail-open: ${APP_RATE_LIMIT_FAIL_OPEN:true}
        redis-fallback-enabled: ${APP_RATE_LIMIT_REDIS_FALLBACK_ENABLED:false}
        login:
            window: ${APP_RATE_LIMIT_LOGIN_WINDOW:10m}
            email-limit: ${APP_RATE_LIMIT_LOGIN_EMAIL_LIMIT:5}
            client-limit: ${APP_RATE_LIMIT_LOGIN_CLIENT_LIMIT:20}
            pair-limit: ${APP_RATE_LIMIT_LOGIN_PAIR_LIMIT:5}
        password-reset:
            window: ${APP_RATE_LIMIT_PASSWORD_RESET_WINDOW:15m}
            email-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_EMAIL_LIMIT:3}
            client-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_CLIENT_LIMIT:10}
            pair-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_PAIR_LIMIT:3}
        password-reset-confirm:
            window: ${APP_RATE_LIMIT_PASSWORD_RESET_CONFIRM_WINDOW:15m}
            client-limit: ${APP_RATE_LIMIT_PASSWORD_RESET_CONFIRM_CLIENT_LIMIT:10}
        refresh:
            window: ${APP_RATE_LIMIT_REFRESH_WINDOW:5m}
            user-limit: ${APP_RATE_LIMIT_REFRESH_USER_LIMIT:20}
            client-limit: ${APP_RATE_LIMIT_REFRESH_CLIENT_LIMIT:60}
