spring:
  autoconfigure:
    exclude:
      - org.springdoc.core.configuration.SpringDocConfiguration
      - org.springdoc.core.configuration.SpringDocSecurityConfiguration
      - org.springdoc.core.configuration.SpringDocPageableConfiguration
      - org.springdoc.core.configuration.SpringDocSortConfiguration
      - org.springdoc.core.configuration.SpringDocWebServerConfiguration.EmbeddedWebServerConfiguration
      - org.springdoc.core.configuration.SpringDocWebServerConfiguration.DeployedWebServerConfiguration
      - org.springdoc.webmvc.core.configuration.SpringDocWebMvcConfiguration
      - org.springdoc.webmvc.core.configuration.MultipleOpenApiSupportConfiguration
      - org.springdoc.webmvc.ui.SwaggerConfig
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.example: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.web: ${LOGGING_LEVEL_SPRING_WEB:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SPRING_SECURITY:WARN}
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_BIND:WARN}
    org.flywaydb: ${LOGGING_LEVEL_FLYWAY:INFO}

app:
  logging:
    json-enabled: ${APP_LOG_JSON_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
