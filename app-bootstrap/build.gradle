plugins {
    id 'org.springframework.boot'
}

import org.springframework.boot.gradle.tasks.run.BootRun

dependencies {
    implementation project(':common')
    implementation project(':database')
    implementation project(':module-identity')
    implementation project(':module-flight')
    implementation project(':module-booking')
    implementation project(':module-payment')
    implementation project(':module-checkin')
    implementation project(':module-notification')
    implementation project(':module-scheduler')
    implementation project(':module-ai')
    implementation project(':module-web')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    implementation 'org.flywaydb:flyway-database-postgresql'
    if (!(findProperty('skipPrometheusRegistry') ?: 'false').toBoolean()) {
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    }
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:8.1'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('bootRun', BootRun) {
    // Optional: tune bootRun heap when the dev machine has very little commit charge / page file.
    // Override in gradle.properties, e.g. bootRunJvmArgs=-Xmx512m
    def bootJvm = findProperty('bootRunJvmArgs')?.toString()
    if (bootJvm?.trim()) {
        jvmArgs = bootJvm.trim().split(/\s+/).toList()
    }

    def envFile = rootProject.file('.env')

    if (envFile.exists()) {
        envFile.eachLine('UTF-8') { rawLine ->
            def line = rawLine?.trim()
            if (!line || line.startsWith('#')) {
                return
            }

            def separatorIndex = line.indexOf('=')
            if (separatorIndex <= 0) {
                return
            }

            def key = line.substring(0, separatorIndex).trim()
            def value = line.substring(separatorIndex + 1).trim()

            if (value.length() >= 2 && value.startsWith('"') && value.endsWith('"')) {
                value = value.substring(1, value.length() - 1)
            }

            environment key, value
        }
    } else {
        logger.lifecycle('No .env file found at {}. bootRun will use the current shell environment.', envFile)
    }
}

tasks.named('test') {
    systemProperty 'skipPrometheusRegistry', (findProperty('skipPrometheusRegistry') ?: 'false').toString()
}
